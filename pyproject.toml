[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "yeast-fusion-segmenter"
version = "0.1.0"
description = "Deep learning-based tool for segmenting yeast cells in fusion experiments using YOLOv8"
readme = "README.MD"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = [
    "yeast", 
    "cell-segmentation", 
    "deep-learning", 
    "computer-vision", 
    "yolo", 
    "microscopy", 
    "image-processing",
    "biology",
    "fusion-experiments"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "h5py>=3.8.0",
    "scikit-image>=0.20.0",
    "opencv-python>=4.7.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.2.0",
    "ultralytics>=8.0.0",
    "czifile>=2019.7.2",
    "pyimagej>=1.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "isort>=5.0",
]
jupyter = [
    "jupyterlab>=3.6.0",
    "jupyterlab-widgets>=3.0.0",
    "ipywidgets>=8.0.0",
    "nbconvert>=7.3.0",
    "notebook>=6.5.0",
]
all = [
    "yeast-fusion-segmenter[dev,jupyter]"
]

[project.urls]
Homepage = "https://github.com/DessimozLab/yeast_fusion_segmenter"
Repository = "https://github.com/DessimozLab/yeast_fusion_segmenter"
Bug-Tracker = "https://github.com/DessimozLab/yeast_fusion_segmenter/issues"
Documentation = "https://github.com/DessimozLab/yeast_fusion_segmenter/blob/main/README.MD"

[project.scripts]
train-yolo = "yeast_fusion_segmenter.train_yolo:main"
batch-predict = "yeast_fusion_segmenter.batch_predict:main"
annotate-images = "yeast_fusion_segmenter.annotate_images:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yeast_fusion_segmenter*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"yeast_fusion_segmenter" = ["*.yaml", "*.yml", "*.pt"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m "not slow"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
