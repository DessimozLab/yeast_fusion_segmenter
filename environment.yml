name: yeast_fusion_segmenter
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  # Core Python
  - python=3.9.23
  - pip=25.2
  
  # Scientific Computing
  - pandas=2.3.1
  - scipy=1.13.1
  - h5py=3.14.0
  - tqdm=4.67.1
  
  # Image Processing
  - matplotlib=3.9.4
  - pillow=11.3.0
  
  # CUDA Toolkit and GPU Support (CUDA 12.9)
  - cuda-toolkit=12.9.1
  - cuda-cudart=12.9.79
  - cuda-libraries=12.9.1
  - cuda-libraries-dev=12.9.1
  - cuda-nvcc=12.9.86
  - cudnn=9.10.2  # CUDA Deep Neural Network library
  
  # Jupyter Environment
  - jupyterlab=4.4.6
  - ipykernel=6.30.1
  - ipython=8.18.1
  - jupyter_client=8.6.3
  - jupyter_core=5.8.1
  - jupyter_server=2.16.0
